services:
  # One-shot cert generator: creates local.crt/local.key if they don't exist.
  # Traefik waits for this before starting. Skipped automatically when certs already exist.
  # For browser-trusted certs: install mkcert, then run: bash init.sh --rotate-certs
  cert-init:
    image: alpine:3.21.3
    volumes:
      - ./traefik/certs:/certs
    command:
      - sh
      - -c
      - |
        if [ -f /certs/local.crt ]; then
          echo "==> cert-init: certs found, skipping"; exit 0
        fi
        apk add --no-cache --quiet openssl
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /certs/local.key -out /certs/local.crt \
          -days 365 -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        chmod 600 /certs/local.key && chmod 644 /certs/local.crt
        echo "==> cert-init: self-signed cert ready (browsers will warn)"
        echo "    For trusted certs: mkcert -install, then bash init.sh --rotate-certs"
    restart: "no"

  traefik:
    image: traefik:v3.7.5
    ports:
      - "8000:80"
      - "4430:443/tcp"
      - "4430:443/udp"  # HTTP/3 / QUIC
      - "127.0.0.1:8080:8080"   # Dashboard — localhost only
      - "${API_BIND_IP:-127.0.0.1}:9000:9000"   # services entryPoint — override API_BIND_IP for LAN/public exposure
    # No Docker socket mount: this stack routes exclusively through the Traefik
    # file provider (traefik/dynamic_conf.yml). Mounting the Docker socket —
    # even read-only — grants the Docker API, which is equivalent to host root.
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app_net

  m8_db:
    image: postgres:18.4-alpine
    volumes:
      - ./db_data:/var/lib/postgresql
      - ../shared/db_init:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./.env                          # exposes all .env vars so init-db.sh can discover DB triplets
    environment:
      - POSTGRES_USER=${DB_USER}        # engine bootstrap — required by the official postgres image
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGPORT=${DB_PORT}
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT} -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot only: the official entrypoint runs initdb + the init-db.sh
      # provisioning on the Unix socket with TCP disabled, so pg_isready over
      # 127.0.0.1 cannot pass until that completes. On a slow (e.g. Windows)
      # bind mount under full-stack build load this can exceed 80s, tripping the
      # old 30s window and failing dependents. A long start_period covers the
      # cold init; start_interval probes every 2s so warm restarts flip healthy
      # immediately (start_period ends the moment a probe succeeds).
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    networks:
      - data_net

  redis_cache:
    image: redis:8.8.0-alpine
    volumes:
      - ./redis/redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    command:
      - sh
      - -c
      - |
        redis-server --save 20 1 --loglevel warning --requirepass "${REDIS_PASSWORD}" &
        until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 0.2; done
        # Per-service scoped ACL (plan 6.x.1): the auth app authenticates as
        # `auth`, restricted to its own key prefixes and only the command
        # categories it uses (read/write strings+hashes, pipelined txns, the
        # refresh-rotation Lua EVAL, connection handshake; dangerous/admin
        # denied). The default user is then stripped of all data/admin access
        # — it keeps only connection commands so the healthcheck PING works.
        redis-cli ACL SETUSER auth on \>"${REDIS_PASSWORD}" "~oauth_session:*" "~auth_code:*" "~login:*" "~refresh:*" "~exchange:*" "~rt:*" "~jwt:blacklist:*" "~rate:*" "~api_key:*" "~introspect:*" "~security:*" +@read +@write +@transaction +@connection +eval -@dangerous "+client|setinfo"
        redis-cli ACL SETUSER default on \>"${REDIS_PASSWORD}" resetkeys -@all +@connection -@dangerous
        wait
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data_net

  # Media-owned Redis (rate limits, queues, locks, cache under the media:* namespace).
  # Separate from the auth redis_cache; internal-only, never exposed to the host.
  media_redis_cache:
    image: redis:8.8.0-alpine
    volumes:
      - ./media_redis/data:/data
    command:
      - sh
      - -c
      - |
        redis-server --save 20 1 --loglevel warning --requirepass "${MEDIA_REDIS_PASSWORD}" &
        until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 0.2; done
        # Per-service scoped ACL (plan 6.x.1): the media app authenticates as
        # `media`, restricted to its own `media:*` namespace plus the `arq:*`
        # queue keys, and only the command categories it uses (rate-limit
        # INCR/EXPIRE, ARQ list/sorted-set/string ops + Lua EVAL, connection
        # handshake; dangerous/admin denied). ARQ also issues `INFO server` on
        # startup to read the Redis version, so +info is re-granted after the
        # -@dangerous strip (ACL rules apply left-to-right). The default user is
        # then stripped of all data/admin access — connection commands only for
        # the PING.
        redis-cli ACL SETUSER media on \>"${MEDIA_REDIS_PASSWORD}" "~media:*" "~arq:*" +@read +@write +@transaction +@connection +eval -@dangerous +info "+client|setinfo"
        redis-cli ACL SETUSER default on \>"${MEDIA_REDIS_PASSWORD}" resetkeys -@all +@connection -@dangerous
        wait
    environment:
      - REDIS_PASSWORD=${MEDIA_REDIS_PASSWORD}
      - REDISCLI_AUTH=${MEDIA_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data_net

  # One-shot: generate the storage backend's static identity table from .env +
  # media.env, BEFORE the backend boots (`weed` reads -s3.config once at
  # startup). This is the SeaweedFS shape of what `mc admin user add` +
  # `mc admin policy attach` did for MinIO: SeaweedFS has no bootstrap-time
  # user-creation API, identities are declared up front in this file.
  #
  # Two identities, and only two:
  #   admin     Admin/Read/Write/List — used ONLY by storage-init (bucket
  #             creation + CORS) and by the backend itself. Sourced from .env,
  #             never from media.env / worker.env, so no application container
  #             ever sees it.
  #   media-rw  Read/Write/List scoped to exactly the five media buckets. This
  #             is what media_service / media_service_worker / media_worker
  #             authenticate as. SeaweedFS's action vocabulary has no separate
  #             delete verb, so MinIO's `s3:DeleteObject` grant lands inside
  #             `Write` here — a coarser verb over the SAME bucket set, not a
  #             wider one (recorded as D2 in the migration matrix).
  #
  # Fails closed: empty or still-placeholder credentials, an admin key equal to
  # the app key, and any value that cannot be embedded verbatim in JSON all
  # abort the boot rather than producing a table that silently grants the wrong
  # thing.
  storage-config:
    image: alpine:3.21.3
    env_file:
      - ./.env                            # admin identity (S3_ROOT_*)
      - ./media.env                       # scoped identity + bucket names
    volumes:
      - ./seaweedfs/config:/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        # <NAME>_FILE wins over <NAME>, the same Docker-secret indirection the
        # app services use under docker-compose.production.yml. Without this the
        # generated table would carry the placeholder from media.env while the
        # apps authenticate with the real secret, and every request would 403.
        pick() {  # pick <value> <file> <label>
          if [ -n "$$2" ]; then
            if [ ! -r "$$2" ]; then
              echo "storage-config: $$3_FILE=$$2 is not readable" >&2; exit 1
            fi
            # $(...) already strips trailing newlines; a stray CR is then
            # caught by the charset guard rather than silently signed with.
            cat "$$2"
          else
            printf '%s' "$$1"
          fi
        }

        require() {  # require <label> <value>
          case "$$2" in
            "")
              echo "storage-config: $$1 is empty — refusing to generate an identity table" >&2
              exit 1 ;;
            changethis)
              echo "storage-config: $$1 is still the placeholder 'changethis' — fill .env/media.env before first boot" >&2
              exit 1 ;;
            *[!A-Za-z0-9._~+/=-]*)
              echo "storage-config: $$1 contains a character this generator will not embed in JSON verbatim (allowed: A-Z a-z 0-9 . _ ~ + / = -)" >&2
              exit 1 ;;
          esac
        }

        ROOT_USER=$$(pick "$${S3_ROOT_USER:-}" "$${S3_ROOT_USER_FILE:-}" S3_ROOT_USER)
        ROOT_PASSWORD=$$(pick "$${S3_ROOT_PASSWORD:-}" "$${S3_ROOT_PASSWORD_FILE:-}" S3_ROOT_PASSWORD)
        APP_KEY=$$(pick "$${S3_ACCESS_KEY:-}" "$${S3_ACCESS_KEY_FILE:-}" S3_ACCESS_KEY)
        APP_SECRET=$$(pick "$${S3_SECRET_KEY:-}" "$${S3_SECRET_KEY_FILE:-}" S3_SECRET_KEY)

        require S3_ROOT_USER "$$ROOT_USER"
        require S3_ROOT_PASSWORD "$$ROOT_PASSWORD"
        require S3_ACCESS_KEY "$$APP_KEY"
        require S3_SECRET_KEY "$$APP_SECRET"

        if [ "$$ROOT_USER" = "$$APP_KEY" ]; then
          echo "storage-config: S3_ROOT_USER must differ from S3_ACCESS_KEY — the app credential must not be the admin credential" >&2
          exit 1
        fi

        ACTIONS=""
        for b in "$$S3_BUCKET_PUBLIC" "$$S3_BUCKET_PRIVATE" "$$S3_BUCKET_SENSITIVE" "$$S3_BUCKET_TEMP" "$$S3_BUCKET_ARCHIVE"; do
          require "bucket name" "$$b"
          for verb in Read Write List; do
            ACTIONS="$$ACTIONS,\"$$verb:$$b\""
          done
        done
        ACTIONS=$${ACTIONS#,}

        umask 027
        cat > /config/s3.json.tmp <<EOF
        {
          "identities": [
            {
              "name": "admin",
              "credentials": [{"accessKey": "$$ROOT_USER", "secretKey": "$$ROOT_PASSWORD"}],
              "actions": ["Admin", "Read", "Write", "List"]
            },
            {
              "name": "media-rw",
              "credentials": [{"accessKey": "$$APP_KEY", "secretKey": "$$APP_SECRET"}],
              "actions": [$$ACTIONS]
            }
          ]
        }
        EOF
        # The storage server runs as uid/gid 1000 and mounts this directory
        # read-only; 0640 keeps the secrets off every other mode bit.
        chown 1000:1000 /config/s3.json.tmp
        chmod 640 /config/s3.json.tmp
        mv /config/s3.json.tmp /config/s3.json
        echo "storage-config: identity table written (admin + media-rw scoped to 5 buckets)"
    restart: "no"
    # It talks to nothing — but a service with no `networks:` gets compose's
    # implicit `default` bridge, which has a gateway. data_net is internal, so
    # the container that handles both credentials has no egress at all.
    networks:
      - data_net

  # Object storage — SeaweedFS, the backend ratified for this fleet (S3 API,
  # SigV4). The application never speaks to it as "SeaweedFS": media_service and
  # media_worker sign plain S3 through the SDK's boto3 client, so this block is
  # the only place the implementation is named.
  #
  # Boot flags, all load-bearing (same as hardened_media_m8 — see
  # T3-run-seaweedfs for the measured D1 finding this depends on):
  #   -ip=localhost      the address master/volume/filer ADVERTISE to each
  #                      other. Without it they advertise the container's
  #                      routable IP while -ip.bind pins them to loopback, and
  #                      every write fails when the filer dials the volume
  #                      server.
  #   -ip.bind=127.0.0.1 master (9333), volume (8080), filer (8888) and webdav
  #                      (7333) bind the container's OWN loopback interface, so
  #                      no sibling on data_net can reach the admin surfaces —
  #                      not even in dev.
  #   -s3.ip.bind=0.0.0.0 only the S3 gateway (8333) is reachable from siblings
  #                      and, via the one loopback port mapping below, the host.
  #   -s3.config          static IAM identities, generated by storage-config
  #                      before this service starts.
  #
  # Dev still publishes the S3 gateway on loopback for local mc/aws-cli access
  # (unlike hardened_media_m8, which has no `ports:` block at all) — but unlike
  # the old MinIO block, there is only ONE port: SeaweedFS's admin/filer
  # surfaces are loopback-bound *inside* the container and are never published,
  # in dev or hardened.
  #
  # Hardened the same as hardened_media_m8's own storage service: non-root, all
  # capabilities dropped, read-only root filesystem. It runs as uid/gid 1000
  # (the image's own `seaweed` user), so ./seaweedfs/data must be writable by
  # uid 1000 (Docker Desktop mounts already are; on a Linux host:
  # `chown -R 1000:1000 seaweedfs/data`).
  storage:
    image: chrislusf/seaweedfs:4.45
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp                            # gRPC unix socket + scratch
      - /run
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    ports:
      - "127.0.0.1:9005:8333"
    volumes:
      - ./seaweedfs/data:/data
      - ./seaweedfs/config:/etc/seaweedfs/config:ro
    command:
      - server
      - -dir=/data
      - -filer
      - -s3
      - -ip=localhost
      - -ip.bind=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      - -s3.config=/etc/seaweedfs/config/s3.json
    depends_on:
      storage-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net
      - data_net

  # One-shot: create the five logical buckets and pin CORS on each of them.
  # Runs against the S3 API with the admin identity storage-config declared —
  # the only container besides the backend itself that ever holds it.
  storage-init:
    image: amazon/aws-cli:2.36.40
    depends_on:
      storage:
        condition: service_healthy
    env_file:
      - ./.env                            # admin identity + CORS origin
      - ./media.env                       # bucket names, endpoint, region
    environment:
      AWS_EC2_METADATA_DISABLED: "true"   # never probe a metadata endpoint
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        pick() {  # pick <value> <file> <label> — Docker secret wins, as in storage-config
          if [ -n "$$2" ]; then
            if [ ! -r "$$2" ]; then
              echo "storage-init: $$3_FILE=$$2 is not readable" >&2; exit 1
            fi
            cat "$$2"
          else
            printf '%s' "$$1"
          fi
        }

        AWS_ACCESS_KEY_ID=$$(pick "$${S3_ROOT_USER:-}" "$${S3_ROOT_USER_FILE:-}" S3_ROOT_USER)
        AWS_SECRET_ACCESS_KEY=$$(pick "$${S3_ROOT_PASSWORD:-}" "$${S3_ROOT_PASSWORD_FILE:-}" S3_ROOT_PASSWORD)
        AWS_DEFAULT_REGION="$${S3_REGION:-us-east-1}"
        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION

        case "$${S3_USE_SSL:-false}" in
          true|True|TRUE|1|yes) SCHEME=https ;;
          *) SCHEME=http ;;
        esac
        ENDPOINT="$$SCHEME://$$S3_ENDPOINT"

        ORIGINS="$${S3_CORS_ALLOW_ORIGIN:-}"
        if [ -z "$$ORIGINS" ]; then
          echo "storage-init: S3_CORS_ALLOW_ORIGIN is empty — set the exact browser origin(s) allowed on the presigned data path" >&2
          exit 1
        fi
        case "$$ORIGINS" in
          *"*"*)
            echo "storage-init: S3_CORS_ALLOW_ORIGIN must not contain '*' — a wildcard origin lets any site drive the presigned data path" >&2
            exit 1 ;;
        esac

        ORIGIN_JSON=""
        OLD_IFS=$$IFS; IFS=,
        for o in $$ORIGINS; do
          ORIGIN_JSON="$$ORIGIN_JSON,\"$$o\""
        done
        IFS=$$OLD_IFS
        ORIGIN_JSON=$${ORIGIN_JSON#,}

        CORS="{\"CORSRules\":[{
          \"AllowedOrigins\":[$$ORIGIN_JSON],
          \"AllowedMethods\":[\"GET\",\"HEAD\",\"POST\"],
          \"AllowedHeaders\":[\"Authorization\",\"Content-Type\",\"Content-Length\",\"Content-Disposition\",\"Range\",\"x-amz-date\",\"x-amz-content-sha256\",\"x-amz-algorithm\",\"x-amz-credential\",\"x-amz-signature\"],
          \"ExposeHeaders\":[\"ETag\",\"Content-Range\",\"Content-Length\",\"Content-Disposition\"],
          \"MaxAgeSeconds\":3000
        }]}"

        for b in "$$S3_BUCKET_PUBLIC" "$$S3_BUCKET_PRIVATE" "$$S3_BUCKET_SENSITIVE" "$$S3_BUCKET_TEMP" "$$S3_BUCKET_ARCHIVE"; do
          if aws --endpoint-url "$$ENDPOINT" s3api head-bucket --bucket "$$b" >/dev/null 2>&1; then
            echo "storage-init: bucket $$b already exists"
          else
            aws --endpoint-url "$$ENDPOINT" s3api create-bucket --bucket "$$b"
            echo "storage-init: bucket $$b created"
          fi
          aws --endpoint-url "$$ENDPOINT" s3api put-bucket-cors --bucket "$$b" --cors-configuration "$$CORS"
          echo "storage-init: CORS pinned on $$b"
        done
        echo "storage-init: 5 buckets ready, CORS scoped to $$ORIGINS"
    restart: "no"
    networks:
      - data_net


  prometheus:
    image: ubuntu/prometheus:3.11-26.04_stable
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0-25530058790
    depends_on:
      - prometheus
    env_file:
      - ./grafana.env
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app_net
    restart: unless-stopped

  auth_user_service:
    image: tepochtli/fa-auth-m8:2.2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    env_file:
      - ./auth.env
    volumes:
      - ./auth.env:/opt/auth_user_service/.env:ro
      - ./shared_migrations:/opt/shared_migrations
      - ./keys:/opt/keys:ro
    depends_on:
      m8_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net
      - data_net

  clamav:
    image: clamav/clamav:1.5-debian13-slim
    # The official image runs both clamd (TCP 3310) and freshclam (DB updates).
    volumes:
      - clamav_db:/var/lib/clamav        # persist the freshclam signature DB
    healthcheck:
      # `clamdcheck.sh` pings the running daemon via clamdscan.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s                  # allow first freshclam download
    restart: unless-stopped
    networks:
      # clamd (:3310) is reachable ONLY by media_worker, which shares scan_net.
      # No other service is on scan_net, so nothing else can talk to clamav.
      - scan_net
      # Private, clamav-only egress so freshclam can fetch DB updates. scan_net is
      # internal (no gateway), so this is clamav's only path to the internet — and
      # it is not shared with any other container.
      - clamav_egress

  # Async ARQ worker (media-worker-m8). Pulls scan_object / generate_variants
  # jobs off the media-owned Redis, scans bytes via clamav, renders image
  # variants, and reports results back to media-service over its INTERNAL HTTP
  # API (Bearer MEDIA_INTERNAL_SERVICE_TOKEN).
  #
  # Uses the published Docker Hub image (NOT built from source): this dev stack
  # builds only media_service from /workspace/media-service-m8/media_service; the
  # worker lives in the separate media-worker-m8 repo.
  #
  # INBOUND-FREE BY DESIGN — like media_service_worker, this process runs no HTTP
  # server (its only entrypoint is `arq worker.settings.WorkerSettings`). It is
  # reached purely as a Redis queue consumer, so it carries NO Traefik label and
  # publishes NO host port: there is nothing to route and nothing to expose. It
  # is confined to the stack's internal networks (never the host, never the LAN).
  # The worker→media-service direction is the only HTTP path, and that is gated
  # by media-service's internal-only Traefik router + the shared service token.
  #
  # The published image already bundles the worker code at /opt/worker; do NOT
  # bind-mount source over it (the source lives in the separate media-worker-m8
  # repo, not under this stack). Only the .env file is mounted, matching the
  # media_service pattern.
  media_worker:
    image: tepochtli/media-worker-m8:0.4.1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    env_file:
      - ./worker.env
    volumes:
      - ./worker.env:/opt/worker/.env:ro
    depends_on:
      clamav:
        condition: service_healthy
      media_redis_cache:                  # ARQ queue the worker consumes
        condition: service_healthy
      storage:                            # object bytes (get/put/remove)
        condition: service_healthy
      storage-init:                         # media-rw creds + buckets must exist
        condition: service_completed_successfully
      media_service:                      # internal callback target
        condition: service_started
    restart: unless-stopped
    networks:
      # data_net carries everything the worker pulls from / reports to:
      # media_redis_cache (ARQ queue), storage (bytes), media_service (internal API).
      - data_net
      # scan_net is the private worker↔clamav segment. NOT on app_net: the worker
      # runs no HTTP server, needs nothing external-facing, and (both its nets are
      # internal) has no internet egress.
      - scan_net

  media_service:
    build:
      context: ../../
      dockerfile: ./media_service/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    env_file:
      - ./media.env
    volumes:
      - ../../media_service:/opt/media_service
      - ./media.env:/opt/media_service/.env:ro
      - ./shared_migrations:/opt/shared_migrations
    depends_on:
      m8_db:
        condition: service_healthy
      auth_user_service:
        condition: service_started
      media_redis_cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app_net
      - data_net

  # Service-owned arq maintenance worker — the SAME image as media_service, run
  # with a command override (no new build / no new Docker Hub publish). Owns the
  # DB-coupled housekeeping crons (hard-purge, stale-upload expiry, orphan
  # reconcile). replicas: 1 keeps a single scheduler so arq cron never
  # double-fires. Runs NO migrations — the web container applies them on startup;
  # this command override bypasses docker_start.sh. Outbound-only: no Traefik
  # label, no exposed port.
  media_service_worker:
    build:
      context: ../../
      dockerfile: ./media_service/Dockerfile
    command: ["arq", "media_service.maintenance_worker.WorkerSettings"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 512M
    env_file:
      - ./media.env
    volumes:
      - ../../media_service:/opt/media_service
      - ./media.env:/opt/media_service/.env:ro
    depends_on:
      m8_db:
        condition: service_healthy
      media_redis_cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      media_service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net
      - data_net

# clamav_db: persists the freshclam signature database across restarts so the
# daemon doesn't re-download the full set on every boot.
volumes:
  clamav_db:

# app_net:       external-facing — Traefik, app services, observability.
# data_net:      internal only (no gateway) — DB and Redis are not reachable from app_net.
# scan_net:      internal — private media_worker↔clamav segment; clamd (:3310) is
#                reachable by NO other service.
# clamav_egress: clamav-only outbound net for freshclam DB updates (not shared).
# App services sit on app_net + data_net; Traefik sits on app_net only and cannot reach
# DB/Redis/clamav. media_worker + clamav are OFF app_net entirely.
networks:
  app_net:
    driver: bridge
    # No explicit `name:` — Compose project-prefixes the network (e.g.
    # dev_media_m8_app_net), keeping it isolated from every other stack. Two
    # projects must never share an app network name (see
    # .workspace/plans/stack/analysis/audit-fa-auth-jwks-kid-key-binding-2026-09-08.md §0.2).
    # Pinned, deterministic subnet so the bridge gateway IP is stable and the
    # allowlists in traefik/dynamic_conf.yml can trust it. 172.16.0.0/16 is RFC1918
    # private space Docker allocates per-bridge on ANY host, independent of the
    # machine's own LAN — portable, NOT tied to this machine. Host->published-port
    # traffic is SNATed to the gateway (172.16.0.1), trusted as "localhost" by the
    # dashboard allowlist; sibling containers keep 172.16.0.x and are NOT trusted.
    # If 172.16.0.0/16 is already in use on a host (e.g. a corporate VPN), change
    # both lines below and the matching CIDRs in traefik/dynamic_conf.yml.
    ipam:
      config:
        - subnet: 172.16.0.0/16
          gateway: 172.16.0.1
  data_net:
    driver: bridge
    internal: true   # no gateway — DB/Redis are unreachable from app_net or the host
  # Private worker↔clamav segment. internal:true → no gateway, so nothing on it can
  # reach the internet, and ONLY media_worker + clamav are attached.
  scan_net:
    driver: bridge
    internal: true
    # No explicit `name:` — project-prefixed, same isolation reasoning as app_net.
  # clamav-ONLY outbound network so freshclam can fetch signature DB updates. No
  # other container attaches here, so this egress path is never shared.
  clamav_egress:
    driver: bridge
