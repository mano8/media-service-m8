line-length = 88

exclude = [
    ".git",
    "__pycache__",
    "docker_compose",   # infrastructure templates, auto-generated migrations
    "**/alembic/versions",   # auto-generated Alembic migration files
]

[lint]
# Explicitly state the historically enforced rule set rather than inherit
# ruff's default, which widened between 0.15 and 0.16 (G8-2), plus TID to
# enforce the SDK import boundary below.
select = ["E4", "E7", "E9", "F", "TID251"]

[lint.flake8-tidy-imports.banned-api]
"auth_sdk_m8".msg = "auth-sdk-m8 must never be imported directly by a consumer service. Use fastapi-m8's re-exports instead."

[lint.per-file-ignores]
# The import boundary applies to service code, not tests (§6 F5's own scope).
"tests/**" = ["TID251"]
